<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- background -->
  <rect width="32" height="32" fill="#07070C"/>
  
  <!-- frame -->
  <rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="#C4A070" stroke-width="1.5"/>

  <!-- I: vertical stroke + top/bottom serifs -->
  <line x1="10" y1="7" x2="10" y2="25" stroke="#C4A070" stroke-width="1.2" stroke-linecap="butt"/>
  <line x1="7.5" y1="7"  x2="12.5" y2="7"  stroke="#C4A070" stroke-width="1" stroke-linecap="butt"/>
  <line x1="7.5" y1="25" x2="12.5" y2="25" stroke="#C4A070" stroke-width="1" stroke-linecap="butt"/>

  <!-- A: two diagonals, crossbar, foot serifs -->
  <line x1="21"   y1="7"  x2="16.5" y2="25" stroke="#C4A070" stroke-width="1.2" stroke-linecap="butt"/>
  <line x1="21"   y1="7"  x2="25.5" y2="25" stroke="#C4A070" stroke-width="1.2" stroke-linecap="butt"/>
  <line x1="18.3" y1="17.8" x2="23.7" y2="17.8" stroke="#C4A070" stroke-width="1" stroke-linecap="butt"/>
  <line x1="14.5" y1="25" x2="18.5" y2="25" stroke="#C4A070" stroke-width="1" stroke-linecap="butt"/>
  <line x1="23.5" y1="25" x2="27.5" y2="25" stroke="#C4A070" stroke-width="1" stroke-linecap="butt"/>
</svg>
